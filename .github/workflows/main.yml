name: Mainline CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Enforce epic-tagged checkpoint
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ ! "$subject" =~ ^\[EPIC-(CORE|UI|A2A|DEMO|CI)\][[:space:]] ]]; then
            echo "Commit subject must begin with [EPIC-CORE], [EPIC-UI], [EPIC-A2A], [EPIC-DEMO], or [EPIC-CI]."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run domain tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build
